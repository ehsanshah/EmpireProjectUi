server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # This image serves UI assets only. Live API requests fail closed until a BFF is configured.
    location ^~ /api/ {
        default_type application/problem+json;
        return 503 '{"title":"Live API unavailable","status":503,"code":"LIVE_API_UNAVAILABLE"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
